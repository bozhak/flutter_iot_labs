name: iot_flutter_lab4
description: IoT Flutter Lab 4 - Auth + MQTT
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Storage
  shared_preferences: ^2.2.2

  # MQTT
  mqtt_client: ^10.2.0

  # Network connectivity
  connectivity_plus: ^5.0.2

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true