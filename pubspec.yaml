name: iot_mqtt_monitor
description: IoT Flutter Lab #5 - API Integration
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP клієнт
  dio: ^5.4.0

  # Зберігання даних
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # MQTT
  mqtt_client: ^10.0.0

  # Connectivity
  connectivity_plus: ^5.0.2

  # UI
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true